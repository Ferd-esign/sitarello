<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferdinando Virno - Portfolio</title>
    <!-- Sora Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Personal Branding/favicon.png">
</head>

<body>
    <header id="main-header">
        <div class="logo-pictogram">
            <a href="#" onclick="renderEsplora(); return false;">
                <!-- Fallback a un div se l'immagine non è ancora caricata -->
                <img src="Personal Branding/pittogramma-ferd.png" alt="FV" class="pictogram"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div style="display:none; font-weight:700; font-size:24px; color:var(--black);">FV</div>
            </a>
        </div>
        <nav id="main-nav">
            <a href="#esplora" class="nav-link active" data-target="esplora">ESPLORA</a>
            <a href="#archivio" class="nav-link" data-target="archivio">ARCHIVIO</a>
            <a href="#contatti" class="nav-link" data-target="contatti">CONTATTI</a>
        </nav>
    </header>

    <main id="app-content">
        <!-- Contenuto dinamico iniettato da JS -->
    </main>

    <footer id="main-footer">
        <div class="footer-top">
            <div class="footer-left-col">
                <a href="#" onclick="renderEsplora(); return false;"
                    style="display: block; width: fit-content; text-decoration: none;">
                    <img src="Personal Branding/pittogramma-ferd.png" alt="FV" class="footer-pictogram"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div style="display:none; font-weight:700; font-size:24px; color:#ffffff;">FV</div>
                </a>
                <div class="footer-links-group">
                    <a href="https://www.linkedin.com/in/ferdinando-virno-62528b218/" target="_blank">Linkedin</a>
                    <a href="https://www.instagram.com/ferd.esign/" target="_blank">Instagram</a>
                </div>
            </div>
            <div class="footer-right-col">
                <p class="footer-bio-short">©Ferdinando Virno è un Visual Designer specializzato in grafica di pubblica
                    utilità e design per la comunità.</p>
                <div class="footer-links-group">
                    <a href="mailto:virnoferdinando@gmail.com">Email</a>
                    <a href="Personal Branding/VIRNO-FERDINANDO_CV_2026.pdf" target="_blank">Scarica CV</a>
                </div>
            </div>
        </div>
        <div class="footer-middle">
            <span class="footer-year">© 2026</span>
            <span class="footer-location">SALERNO / NAPOLI</span>
        </div>
        <hr class="footer-divider">
        <div class="footer-bottom-huge">
            <img src="Personal Branding/FerdinandoVirno-2.png" alt="Ferdinando Virno" class="footer-bottom-logo"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div
                style="display:none; font-weight:700; font-size:48px; text-transform:uppercase; text-align:center; color:#ffffff;">
                Ferdinando Virno</div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
