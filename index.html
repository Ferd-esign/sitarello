<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferdinando Virno - Portfolio</title>
    <!-- Sora Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Personal Branding/favicon.png">
</head>

<body>
    <header id="main-header">
        <div class="logo-pictogram">
            <a href="#" onclick="renderEsplora(); return false;">
                <!-- Fallback a un div se l'immagine non è ancora caricata -->
                <img src="Personal Branding/pittogramma-ferd.png" alt="FV" class="pictogram"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div style="display:none; font-weight:700; font-size:24px; color:var(--black);">FV</div>
            </a>
        </div>
        <nav id="main-nav">
            <a href="#esplora" class="nav-link active" data-target="esplora">ESPLORA</a>
            <a href="#archivio" class="nav-link" data-target="archivio">ARCHIVIO</a>
            <a href="#contatti" class="nav-link" data-target="contatti">ABOUT</a>
        </nav>
    </header>

    <main id="app-content">
        <!-- Contenuto dinamico iniettato da JS -->
    </main>

    <footer id="main-footer">
        <!-- DESKTOP: 3 colonne | MOBILE: stacked -->
        <div class="footer-inner">

            <!-- COL SX — Contatti -->
            <div class="footer-col footer-col-left">
                <div class="footer-contact-block">
                    <span class="footer-label">CONTATTI</span>
                    <a href="mailto:virnoferdinando@gmail.com">virnoferdinando@gmail.com</a>
                </div>
                <div class="footer-contact-block" style="margin-top:20px;">
                    <span class="footer-label">SOCIAL</span>
                    <a href="https://www.linkedin.com/in/ferdinando-virno-62528b218/" target="_blank">LinkedIn</a>
                    <a href="https://www.instagram.com/ferd.esign/" target="_blank">Instagram</a>
                </div>
            </div>

            <!-- COL CENTRO — Immagine nome grande -->
            <div class="footer-col footer-col-center">
                <img src="Personal Branding/FerdinandoVirno-2.png" alt="Ferdinando Virno" class="footer-bottom-logo"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div
                    style="display:none; font-weight:700; font-size:48px; text-transform:uppercase; text-align:center; color:#ffffff;">
                    Ferdinando Virno</div>
            </div>

            <!-- COL DX — Info -->
            <div class="footer-col footer-col-right">

                <div class="footer-contact-block" style="margin-top:24px;">
                    <span class="footer-label">BASE</span>
                    <span class="footer-info-val">SALERNO / ROMA</span>
                </div>
                <div class="footer-contact-block" style="margin-top:24px;">
                    <span class="footer-label">DISCIPLINE</span>
                    <span class="footer-info-val"> COMUNICAZIONE<br>SYSTEMIC DESIGN</span>
                </div>
            </div>

        </div>

        <hr class="footer-divider">
        <div class="footer-credits">
            <span>©2026 Ferdinando Virno — Tutti i diritti riservati</span>
            <span>ferd.esign</span>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
